name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        node-version: [ 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check src/cli.js
          node --check src/daemon.js
          node --check src/coordinator.js
          node --check src/git.js
          node --check src/rules.js
          node --check src/history.js
          node --check src/onboarding.js
          node --check src/checkpoint.js
          node --check src/service-lock.js
          node --check src/mcp.js
          node --check src/store.js
          node --check src/ai.js
          node --check src/p2p.js
          node --check src/scout.js
          node --check src/secrets.js
          node --check src/metrics.js
          node --check src/webhooks.js
          node --check src/worktree.js
          node --check src/remote-client.js
          node --check src/operations.js

      - name: Run automated test suite
        run: npm test

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DevSync HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #eaf0ff;
    }

    /* Pill Mode (Compact) */
    #hud-pill {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 26px;
      background: rgba(13, 21, 38, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(155, 202, 255, 0.28);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      cursor: grab;
      height: 48px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #hud-pill:active { cursor: grabbing; }

    .pill-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 10px #6ee7b7;
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }
    .status-dot.warn { background: #ffd994; box-shadow: 0 0 10px #ffd994; }
    .status-dot.error { background: #fca5a5; box-shadow: 0 0 10px #fca5a5; }

    .status-text {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a8b9d4;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .hud-btn:hover {
      background: rgba(155, 202, 255, 0.25);
      color: #fff;
      transform: scale(1.05);
    }

    /* Palette Mode (Expanded Spotlight) */
    #hud-palette {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: rgba(13, 21, 38, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(155, 202, 255, 0.35);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .palette-header {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(155, 202, 255, 0.15);
      background: rgba(255, 255, 255, 0.02);
    }

    .palette-input {
      -webkit-app-region: no-drag;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: #fff;
    }
    .palette-input::placeholder { color: #64748b; }

    .palette-tabs {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(155, 202, 255, 0.1);
      background: rgba(0, 0, 0, 0.15);
    }

    .palette-tab {
      background: transparent;
      border: none;
      color: #a8b9d4;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .palette-tab.active {
      background: rgba(155, 202, 255, 0.18);
      color: #9bcaff;
    }

    .palette-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s, border-color 0.15s;
    }
    .project-row:hover, .project-row.selected {
      background: rgba(155, 202, 255, 0.12);
      border-color: rgba(155, 202, 255, 0.3);
    }

    .project-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .project-name {
      font-size: 13px;
      font-weight: 600;
      color: #eaf0ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .project-meta {
      font-size: 11px;
      color: #94a3b8;
    }

    .project-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-act {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-act:hover {
      background: rgba(155, 202, 255, 0.25);
      color: #fff;
    }

    /* Catch-Up Card */
    .catchup-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(155, 202, 255, 0.2);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .catchup-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #9bcaff;
    }
    .catchup-summary {
      font-size: 12px;
      line-height: 1.45;
      color: #e2e8f0;
    }
    .catchup-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .catchup-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .catchup-list li {
      font-size: 12px;
      color: #cbd5e1;
      padding-left: 12px;
      position: relative;
    }
    .catchup-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #9bcaff;
    }
    .next-step-box {
      background: rgba(110, 231, 183, 0.1);
      border: 1px solid #6ee7b7;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #6ee7b7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      border: 1px solid rgba(155, 202, 255, 0.3);
      color: #9bcaff;
    }
  </style>
</head>
<body>

  <!-- Pill Mode -->
  <div id="hud-pill">
    <div class="pill-left">
      <div class="status-dot" id="dot"></div>
      <span class="status-text" id="status-text">DevSync</span>
    </div>
    <div class="hud-actions">
      <button class="hud-btn" id="btn-sync" title="Sincronizar todos os projetos">🔄</button>
      <button class="hud-btn" id="btn-palette" title="Abrir Paleta de Comandos & Catch-Up (Ctrl+Shift+D)">🔍</button>
      <button class="hud-btn" id="btn-expand" title="Abrir Painel Completo">⤢</button>
      <button class="hud-btn" id="btn-close" title="Fechar HUD">✕</button>
    </div>
  </div>

  <!-- Palette / Spotlight Mode -->
  <div id="hud-palette">
    <div class="palette-header">
      <span style="font-size: 14px;">⚡</span>
      <input id="palette-search" class="palette-input" placeholder="Buscar projeto... (Enter: sync, Alt+C: Code, Alt+G: Git)" autocomplete="off">
      <div class="hud-actions">
        <button class="hud-btn" id="btn-collapse" title="Recolher para pílula (Esc)">✕</button>
      </div>
    </div>
    <div class="palette-tabs">
      <button class="palette-tab active" id="tab-projects" type="button">Projetos</button>
      <button class="palette-tab" id="tab-catchup" type="button">🌅 Catch-Up Matinal</button>
    </div>
    <div class="palette-body" id="palette-content">
      <!-- Injected dynamically -->
    </div>
  </div>

  <script>
    const token = location.hash.replace('#', '');
    const origin = location.origin;
    let allProjects = [];
    let selectedIndex = 0;
    let currentTab = 'projects';
    let isPaletteOpen = false;
    let lastCatchUp = null;

    async function api(route, body) {
      const res = await fetch(`${origin}/api/${route}`, {
        method: body ? 'POST' : 'GET',
        headers: { authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        ...(body ? { body: JSON.stringify(body) } : {})
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro na requisição.');
      return data;
    }

    async function updateStatus() {
      try {
        const data = await api('status');
        allProjects = data.projects || [];
        const dirtyOrDiverged = allProjects.filter(p => ['dirty', 'diverged', 'error'].includes(p.state));
        const dot = document.getElementById('dot');
        const text = document.getElementById('status-text');

        if (dirtyOrDiverged.length > 0) {
          dot.className = 'status-dot warn';
          text.textContent = `${dirtyOrDiverged.length} pendência(s)`;
        } else {
          dot.className = 'status-dot';
          text.textContent = `${allProjects.length} em dia`;
        }

        if (isPaletteOpen && currentTab === 'projects') renderProjects();
      } catch {}
    }

    function openPalette() {
      isPaletteOpen = true;
      document.getElementById('hud-pill').style.display = 'none';
      document.getElementById('hud-palette').style.display = 'flex';
      if (window.devsyncDesktop?.setHudSize) {
        window.devsyncDesktop.setHudSize(460, 420);
      }
      document.getElementById('palette-search').value = '';
      document.getElementById('palette-search').focus();
      renderCurrentTab();
    }

    function closePalette() {
      isPaletteOpen = false;
      document.getElementById('hud-palette').style.display = 'none';
      document.getElementById('hud-pill').style.display = 'flex';
      if (window.devsyncDesktop?.setHudSize) {
        window.devsyncDesktop.setHudSize(320, 52);
      }
    }

    function renderCurrentTab() {
      if (currentTab === 'projects') renderProjects();
      else renderCatchUp();
    }

    function renderProjects() {
      const host = document.getElementById('palette-content');
      host.innerHTML = '';
      const query = (document.getElementById('palette-search').value || '').toLowerCase().trim();
      const filtered = allProjects.filter(p => p.name.toLowerCase().includes(query) || (p.path || '').toLowerCase().includes(query));

      if (!filtered.length) {
        host.innerHTML = '<p style="text-align: center; color: #64748b; padding: 24px;">Nenhum projeto encontrado.</p>';
        return;
      }

      filtered.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'project-row' + (idx === selectedIndex ? ' selected' : '');

        const info = document.createElement('div');
        info.className = 'project-info';
        info.innerHTML = `
          <span class="project-name">${p.name} <span class="badge">${p.branch || 'main'}</span></span>
          <span class="project-meta">${p.state === 'synced' ? '✓ Sincronizado' : '⚠️ ' + p.state} · ${p.path}</span>
        `;

        const actions = document.createElement('div');
        actions.className = 'project-actions';

        const syncBtn = document.createElement('button');
        syncBtn.className = 'btn-act';
        syncBtn.textContent = '🔄';
        syncBtn.title = 'Sincronizar (Enter)';
        syncBtn.onclick = async e => {
          e.stopPropagation();
          syncBtn.textContent = '⏳';
          try {
            await api('command', { command: 'sync', id: p.id });
            await updateStatus();
          } catch {}
          syncBtn.textContent = '✓';
          setTimeout(() => syncBtn.textContent = '🔄', 1000);
        };

        const codeBtn = document.createElement('button');
        codeBtn.className = 'btn-act';
        codeBtn.textContent = '💻';
        codeBtn.title = 'Abrir no VS Code (Alt+C)';
        codeBtn.onclick = e => {
          e.stopPropagation();
          if (window.devsyncDesktop?.openInEditor) {
            window.devsyncDesktop.openInEditor(p.path);
          }
        };

        const catchupBtn = document.createElement('button');
        catchupBtn.className = 'btn-act';
        catchupBtn.textContent = '🌅';
        catchupBtn.title = 'Catch-up Matinal';
        catchupBtn.onclick = async e => {
          e.stopPropagation();
          triggerCatchUp(p.id);
        };

        actions.append(syncBtn, codeBtn, catchupBtn);
        row.append(info, actions);
        row.onclick = () => {
          selectedIndex = idx;
          renderProjects();
        };

        host.appendChild(row);
      });
    }

    async function triggerCatchUp(projectId) {
      currentTab = 'catchup';
      document.getElementById('tab-projects').classList.remove('active');
      document.getElementById('tab-catchup').classList.add('active');
      const host = document.getElementById('palette-content');
      host.innerHTML = '<p style="text-align: center; color: #9bcaff; padding: 24px;">Analisando sessão anterior e gerando resumo com IA...</p>';

      try {
        const res = await api('command', { command: 'catch-up', id: projectId });
        lastCatchUp = res.briefing;
        renderCatchUp();
      } catch (err) {
        host.innerHTML = `<p style="color: #fca5a5; padding: 14px;">Erro ao gerar catch-up: ${err.message}</p>`;
      }
    }

    function renderCatchUp() {
      const host = document.getElementById('palette-content');
      if (!lastCatchUp) {
        host.innerHTML = `
          <div style="text-align: center; padding: 30px 10px; color: #94a3b8;">
            <p style="font-size: 14px; margin-bottom: 10px;">Nenhum resumo matinal gerado ainda hoje.</p>
            <button class="btn-act" style="margin: 0 auto; padding: 6px 14px;" onclick="triggerCatchUp()">Gerar Catch-Up do Projeto Ativo</button>
          </div>
        `;
        return;
      }

      host.innerHTML = `
        <div class="catchup-card">
          <div class="catchup-title">
            <span>🌅 ${lastCatchUp.projectName}</span>
            <span class="badge">${lastCatchUp.method === 'gemini-ai' ? 'Gemini AI' : 'Heurística Semântica'}</span>
          </div>
          <div class="catchup-summary">${lastCatchUp.summary}</div>

          <div class="catchup-section-title">Principais Alterações Sincronizadas</div>
          <ul class="catchup-list">
            ${(lastCatchUp.highlights || []).map(h => `<li>${h}</li>`).join('')}
          </ul>

          ${(lastCatchUp.todos || []).length ? `
            <div class="catchup-section-title">Pontos de Atenção & TODOs</div>
            <ul class="catchup-list">
              ${lastCatchUp.todos.map(t => `<li style="color: #ffd994;">${t}</li>`).join('')}
            </ul>
          ` : ''}

          <div class="next-step-box">
            <span><strong>Próximo passo:</strong> ${lastCatchUp.nextStep}</span>
          </div>
        </div>
      `;
    }

    // Tab buttons
    document.getElementById('tab-projects').onclick = () => {
      currentTab = 'projects';
      document.getElementById('tab-catchup').classList.remove('active');
      document.getElementById('tab-projects').classList.add('active');
      renderProjects();
    };
    document.getElementById('tab-catchup').onclick = () => {
      if (!lastCatchUp) triggerCatchUp();
      else {
        currentTab = 'catchup';
        document.getElementById('tab-projects').classList.remove('active');
        document.getElementById('tab-catchup').classList.add('active');
        renderCatchUp();
      }
    };

    // Input search filter
    document.getElementById('palette-search').oninput = () => {
      selectedIndex = 0;
      if (currentTab === 'projects') renderProjects();
    };

    // Keyboard navigation
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (isPaletteOpen) closePalette();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (!isPaletteOpen) openPalette();
        else {
          currentTab = currentTab === 'projects' ? 'catchup' : 'projects';
          if (currentTab === 'projects') {
            document.getElementById('tab-catchup').classList.remove('active');
            document.getElementById('tab-projects').classList.add('active');
          } else {
            document.getElementById('tab-projects').classList.remove('active');
            document.getElementById('tab-catchup').classList.add('active');
          }
          renderCurrentTab();
        }
      } else if (e.key === 'Enter' && isPaletteOpen && currentTab === 'projects') {
        const query = (document.getElementById('palette-search').value || '').toLowerCase().trim();
        const filtered = allProjects.filter(p => p.name.toLowerCase().includes(query) || (p.path || '').toLowerCase().includes(query));
        if (filtered[selectedIndex]) {
          api('command', { command: 'sync', id: filtered[selectedIndex].id }).then(updateStatus);
        }
      } else if (e.altKey && e.key.toLowerCase() === 'c' && isPaletteOpen && currentTab === 'projects') {
        const query = (document.getElementById('palette-search').value || '').toLowerCase().trim();
        const filtered = allProjects.filter(p => p.name.toLowerCase().includes(query) || (p.path || '').toLowerCase().includes(query));
        if (filtered[selectedIndex] && window.devsyncDesktop?.openInEditor) {
          window.devsyncDesktop.openInEditor(filtered[selectedIndex].path);
        }
      } else if (e.altKey && e.key.toLowerCase() === 'g' && isPaletteOpen && currentTab === 'projects') {
        const query = (document.getElementById('palette-search').value || '').toLowerCase().trim();
        const filtered = allProjects.filter(p => p.name.toLowerCase().includes(query) || (p.path || '').toLowerCase().includes(query));
        if (filtered[selectedIndex]?.remoteUrl && window.devsyncDesktop?.openExternal) {
          window.devsyncDesktop.openExternal(filtered[selectedIndex].remoteUrl);
        }
      }
    });

    // Button interactions
    document.getElementById('btn-sync').onclick = async () => {
      const btn = document.getElementById('btn-sync');
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.5s';
      try {
        await api('command', { command: 'sync-all' });
      } catch {}
      setTimeout(() => { btn.style.transform = 'none'; btn.style.transition = 'none'; updateStatus(); }, 500);
    };

    document.getElementById('btn-palette').onclick = openPalette;
    document.getElementById('btn-collapse').onclick = closePalette;

    document.getElementById('btn-expand').onclick = () => {
      if (window.devsyncDesktop?.showMain) window.devsyncDesktop.showMain();
    };

    document.getElementById('btn-close').onclick = () => {
      if (window.devsyncDesktop?.closeHud) window.devsyncDesktop.closeHud();
    };

    updateStatus();
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0d1424"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>DevSync — Coordenador Remoto</title>
<style>:root{color-scheme:dark;--bg:#0d1424;--panel:#151f33;--input-bg:#090e1a;--btn-bg:#22385c;--line:#2e3e5b;--text:#e8efff;--muted:#a9b8d1;--accent:#9bcaff;--ok:#6ee7b7;--warn:#ffd994;--danger:#fca5a5}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif;max-width:1020px;margin:32px auto;padding:20px}h1{font-size:28px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 6px}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:20px 0;box-shadow:0 4px 16px rgba(0,0,0,.15)}input,button{font:inherit;color:inherit;background:var(--btn-bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px}input{background:var(--input-bg);width:100%;max-width:420px}button{cursor:pointer;font-weight:600;transition:opacity .15s}button:hover{opacity:.9}#feedback{color:var(--warn);white-space:pre-wrap;min-height:24px;font-weight:500}small{color:var(--muted);font-size:13px}p{color:var(--muted);line-height:1.5}.device-card{display:flex;flex-direction:column;gap:16px}.project-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px;background:var(--input-bg);border:1px solid var(--line);border-radius:10px;margin:8px 0}.project-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:16px;margin:16px auto}.project-row{flex-direction:column;align-items:flex-start}button,input{width:100%}}</style></head><body>
<h1>DevSync Coordenador</h1><p>Acompanhe seus computadores (Casa e Trabalho) e solicite sincronizações de qualquer lugar.</p>
<form id="login"><input id="token" type="password" required placeholder="Token de administrador" aria-label="Token de administrador"><button>Conectar</button></form>
<section><h2>Adicionar computador</h2><form id="pair"><input id="name" required placeholder="Casa ou Trabalho" aria-label="Nome do computador"><button>Gerar conexão</button></form><p id="pairing"></p></section>
<p id="feedback" role="status"></p><main id="devices"></main><section><h2>Solicitações</h2><div id="jobs"></div></section>
<script>
let token=''; const $=s=>document.querySelector(s);function el(tag,text,css){const n=document.createElement(tag);if(text)n.textContent=text;if(css)n.className=css;return n}
async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function action(route,body){try{await api(route,body);$('#feedback').textContent='Solicitação salva.';await refresh()}catch(e){$('#feedback').textContent=e.message}}
async function refresh(){if(!token)return;try{const d=await api('devices');$('#devices').replaceChildren();for(const pc of d.devices){const card=el('section','','device-card');card.append(el('h2',pc.name+' • '+(pc.online?'Online':'Offline')),el('small','Última conexão: '+(pc.lastSeen?new Date(pc.lastSeen).toLocaleString():'aguardando pareamento')));for(const p of pc.projects){const row=el('div','','project-row'),info=el('div','');info.append(el('h3',p.name),el('p',p.branch+' • '+(p.paused?'paused':p.state)));row.append(info);const act=el('div','','project-actions');for(const [command,label]of [['sync','Sincronizar'],[p.paused?'resume':'pause',p.paused?'Retomar':'Pausar']]){const b=el('button',label);b.onclick=()=>action('queue',{deviceId:pc.id,projectId:p.id,command});act.append(b)}row.append(act);card.append(row)}const revoke=el('button','Desconectar computador');revoke.onclick=()=>{if(confirm('Revogar a conexão de '+pc.name+'?'))action('revoke',{deviceId:pc.id})};card.append(revoke);$('#devices').append(card)}$('#jobs').replaceChildren(...d.jobs.slice(-30).reverse().map(j=>el('p',j.command.command+' • '+(j.status==='pending'?'Aguardando computador':j.ok?'Concluído':'Falhou: '+j.error)+' • '+new Date(j.createdAt).toLocaleString())))}catch(e){$('#feedback').textContent=e.message}}
$('#login').onsubmit=e=>{e.preventDefault();token=$('#token').value;$('#token').value='';refresh()};$('#pair').onsubmit=async e=>{e.preventDefault();try{const d=await api('pair',{name:$('#name').value});$('#pairing').textContent='No painel local, configure o servidor '+location.origin+', ID '+d.deviceId+' e token '+d.token+'. Guarde o token; ele dá acesso a este computador.';refresh()}catch(e){$('#feedback').textContent=e.message}};setInterval(refresh,10000);
</script></html>

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevSync — computadores</title>
<style>body{background:#0d1424;color:#e8efff;font-family:system-ui;max-width:1000px;margin:40px auto;padding:24px}section{background:#151f33;border:1px solid #2e3e5b;border-radius:16px;padding:24px;margin:20px 0}input,button{font:inherit;color:inherit;background:#22385c;border:1px solid #42577c;border-radius:8px;padding:10px;margin:4px}input{max-width:90%;width:400px}button{cursor:pointer}#feedback{color:#ffd994;white-space:pre-wrap}small{color:#a9b8d1}</style>
<h1>Seus computadores</h1><p>Acompanhe os projetos e solicite sincronizações mesmo quando o PC estiver offline.</p>
<form id="login"><input id="token" type="password" required placeholder="Token de administrador" aria-label="Token de administrador"><button>Conectar</button></form>
<section><h2>Adicionar computador</h2><form id="pair"><input id="name" required placeholder="Casa ou Trabalho" aria-label="Nome do computador"><button>Gerar conexão</button></form><p id="pairing"></p></section>
<p id="feedback" role="status"></p><main id="devices"></main><section><h2>Solicitações</h2><div id="jobs"></div></section>
<script>
let token=''; const $=s=>document.querySelector(s);function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function action(route,body){try{await api(route,body);$('#feedback').textContent='Solicitação salva.';await refresh()}catch(e){$('#feedback').textContent=e.message}}
async function refresh(){if(!token)return;try{const d=await api('devices');$('#devices').replaceChildren();for(const pc of d.devices){const card=el('section','');card.append(el('h2',pc.name+' • '+(pc.online?'Online':'Offline')),el('small','Última conexão: '+(pc.lastSeen?new Date(pc.lastSeen).toLocaleString():'aguardando pareamento')));for(const p of pc.projects){const row=el('div','');row.append(el('h3',p.name),el('p',p.branch+' • '+(p.paused?'paused':p.state)));for(const [command,label]of [['sync','Sincronizar'],[p.paused?'resume':'pause',p.paused?'Retomar':'Pausar']]){const b=el('button',label);b.onclick=()=>action('queue',{deviceId:pc.id,projectId:p.id,command});row.append(b)}card.append(row)}const revoke=el('button','Desconectar computador');revoke.onclick=()=>{if(confirm('Revogar a conexão de '+pc.name+'?'))action('revoke',{deviceId:pc.id})};card.append(revoke);$('#devices').append(card)}$('#jobs').replaceChildren(...d.jobs.slice(-30).reverse().map(j=>el('p',j.command.command+' • '+(j.status==='pending'?'Aguardando computador':j.ok?'Concluído':'Falhou: '+j.error)+' • '+new Date(j.createdAt).toLocaleString())))}catch(e){$('#feedback').textContent=e.message}}
$('#login').onsubmit=e=>{e.preventDefault();token=$('#token').value;$('#token').value='';refresh()};$('#pair').onsubmit=async e=>{e.preventDefault();try{const d=await api('pair',{name:$('#name').value});$('#pairing').textContent='No painel local, configure o servidor '+location.origin+', ID '+d.deviceId+' e token '+d.token+'. Guarde o token; ele dá acesso a este computador.';refresh()}catch(e){$('#feedback').textContent=e.message}};setInterval(refresh,10000);
</script></html>

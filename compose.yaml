services:
  coordinator:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DEVSYNC_ADMIN_TOKEN: ${DEVSYNC_ADMIN_TOKEN:?Configure o token em .env}
      DEVSYNC_COORDINATOR_HOST: 0.0.0.0
      DEVSYNC_COORDINATOR_PORT: 8787
      DEVSYNC_COORDINATOR_HOME: /data
    volumes:
      - coordinator_data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 256m

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      DEVSYNC_DOMAIN: ${DEVSYNC_DOMAIN:?Configure seu domínio em .env}
      ACME_EMAIL: ${ACME_EMAIL:?Configure seu email em .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      coordinator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  coordinator_data:
  caddy_data:
  caddy_config:
